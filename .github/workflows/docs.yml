name: Documentation

on:
  push:
    branches: [main]
    paths: ["docs/**", "README.md", "scripts/build_docs.py", "scripts/new_journal.py", "scripts/export_website.py", "tests/docs/**", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "README.md", "scripts/build_docs.py", "scripts/new_journal.py", "scripts/export_website.py", "tests/docs/**", ".github/workflows/docs.yml"]
  workflow_dispatch:
    inputs:
      deploy_standalone:
        description: Deploy a standalone project Pages site (requires Pages setup)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements.txt
      - name: Test the documentation builder
        run: python -m unittest discover -s tests/docs -v
      - name: Build and validate HTML
        run: python scripts/build_docs.py --check
      - name: Save preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: documentation-preview
          path: build/docs-site
      - name: Prepare Pages artifact
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_standalone
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/docs-site

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_standalone
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
